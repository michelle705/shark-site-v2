<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A2E3D" />
    <title>Shark Branding Solutions — AI Visibility Consulting Tampa Bay</title>
    <meta name="description" content="Shark Branding Solutions helps Tampa Bay businesses get found, trusted, and chosen in search and AI. Free visibility scan for local service businesses." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sharkbrandingsolutions.com/" />
    <script>
      (function () {
        var isPreviewHost = window.location.hostname === 'michelle705.github.io';
        var assetBase = isPreviewHost ? '/shark-branding-v3' : '';
        document.write('<link rel="icon" type="image/svg+xml" href="' + assetBase + '/favicon.svg" />');
        document.write('<script type="module" crossorigin src="' + assetBase + '/assets/index-BY-W0gEd.js"><' + '/script>');
        document.write('<link rel="stylesheet" crossorigin href="' + assetBase + '/assets/index-BUvTBILC.css">');
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sharkbrandingsolutions.com/" />
    <meta property="og:title" content="Shark Branding Solutions — AI Visibility Consulting Tampa Bay" />
    <meta property="og:description" content="Shark Branding Solutions helps Tampa Bay businesses get found, trusted, and chosen in search and AI." />
    <meta property="og:image" content="https://sharkbrandingsolutions.com/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: DM Serif Display (headings) + Outfit (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://sharkbrandingsolutions.com/#organization",
      "name": "Shark Branding Solutions",
      "url": "https://sharkbrandingsolutions.com",
      "logo": "https://sharkbrandingsolutions.com/logo.png",
      "image": "https://sharkbrandingsolutions.com/opengraph.jpg",
      "description": "AI visibility consulting for Tampa Bay local businesses. We help businesses get found, trusted, and chosen in search and AI.",
      "telephone": "",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tampa",
        "addressRegion": "FL",
        "addressCountry": "US"
      },
      "areaServed": [
        "Tampa", "Tampa Bay", "Lutz", "Land O Lakes", "Wesley Chapel", "St. Petersburg"
      ],
      "serviceType": [
        "AI Visibility Consulting",
        "Local SEO",
        "Generative Engine Optimization",
        "Google Business Profile Optimization",
        "Digital Presence Audit"
      ],
      "sameAs": [
        "https://www.northtampabaychamber.com/list/member/shark-branding-solutions"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Embedded chatbot widget (hidden, inside branded popup) -->
    <div id="shark-chat-popup" aria-label="Chat with us" role="dialog" aria-modal="true">
      <div id="shark-chat-popup-header">
        <div id="shark-chat-popup-title">
          <svg viewBox="0 0 24 24" fill="white" width="18" height="18"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
          Chat with Shark Branding
        </div>
        <button id="shark-chat-close" aria-label="Close chat">&times;</button>
      </div>
      <div id="embedded-widget-container"></div>
    </div>

    <!-- Floating teal launcher button -->
    <button id="shark-chat-launcher" aria-label="Open chat" title="Chat with us">
      <svg id="shark-chat-icon-open" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
      </svg>
      <svg id="shark-chat-icon-close" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Chatbot SDK — embedded mode -->
    <script
      src="https://cdn.apigateway.co/webchat-client..prod/sdk.js"
      data-widget-id="b9dd1fd7-88ec-11f0-91f4-3228900e0384"
      data-embed-mode="embedded"
      data-embed-target="embedded-widget-container"
      defer
    ></script>

    <style>
      /* ── Branded chat popup container ── */
      #shark-chat-popup {
        display: none;
        position: fixed;
        bottom: 96px;
        right: 24px;
        width: 370px;
        height: 560px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(21,180,214,0.30), 0 2px 12px rgba(0,0,0,0.18);
        z-index: 99998;
        flex-direction: column;
        background: #fff;
        animation: sharkChatIn 0.22s ease;
      }
      #shark-chat-popup.open {
        display: flex;
      }
      @keyframes sharkChatIn {
        from { opacity: 0; transform: translateY(12px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
      }

      /* ── Navy header bar ── */
      #shark-chat-popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: #1A2E3D;
        flex-shrink: 0;
      }
      #shark-chat-popup-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        font-family: 'Outfit', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #shark-chat-close {
        background: none;
        border: none;
        color: rgba(255,255,255,0.7);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
        transition: color 0.15s;
      }
      #shark-chat-close:hover { color: #fff; }

      /* ── Embedded widget fills the rest ── */
      #embedded-widget-container {
        flex: 1;
        overflow: hidden;
      }
      #embedded-widget-container iframe {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
      }

      /* ── Floating launcher button ── */
      #shark-chat-launcher {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        width: 60px;
        height: 60px;
        background: #15B4D6;
        border: none;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(21,180,214,0.45);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      }
      #shark-chat-launcher:hover {
        background: #0fa0be;
        transform: scale(1.07);
        box-shadow: 0 6px 30px rgba(21,180,214,0.55);
      }
      #shark-chat-launcher svg {
        width: 26px;
        height: 26px;
        fill: #fff;
      }

      /* Mobile: full-screen popup */
      @media (max-width: 440px) {
        #shark-chat-popup {
          width: 100vw;
          height: 100dvh;
          bottom: 0;
          right: 0;
          border-radius: 0;
        }
      }
    </style>

    <script>
      (function () {
        var popup    = document.getElementById('shark-chat-popup');
        var launcher = document.getElementById('shark-chat-launcher');
        var closeBtn = document.getElementById('shark-chat-close');
        var iconOpen = document.getElementById('shark-chat-icon-open');
        var iconClose= document.getElementById('shark-chat-icon-close');

        function openChat() {
          popup.classList.add('open');
          iconOpen.style.display  = 'none';
          iconClose.style.display = '';
          launcher.setAttribute('aria-expanded', 'true');
        }

        function closeChat() {
          popup.classList.remove('open');
          iconOpen.style.display  = '';
          iconClose.style.display = 'none';
          launcher.setAttribute('aria-expanded', 'false');
        }

        launcher.addEventListener('click', function () {
          popup.classList.contains('open') ? closeChat() : openChat();
        });

        closeBtn.addEventListener('click', closeChat);

        /* Close on Escape */
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeChat();
        });
      })();
    </script>
  </body>
</html>
